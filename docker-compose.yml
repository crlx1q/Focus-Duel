version: '3.9'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: focusduel
      POSTGRES_PASSWORD: focusduel
      POSTGRES_DB: focusduel
    ports:
      - "5432:5432"
    volumes:
      - focusduel_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focusduel"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  focusduel_pg:
