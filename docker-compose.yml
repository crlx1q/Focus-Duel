version: '3.9'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: focusduel
      POSTGRES_PASSWORD: focusduel
      POSTGRES_DB: focusduel
    ports:
      - "5432:5432"
    volumes:
      - focusduel_pg:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  focusduel_pg:
